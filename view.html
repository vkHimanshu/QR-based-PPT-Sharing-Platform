<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>View Uploads</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .upload-list {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }
        .upload-card {
            background: #111;
            border: 1px solid #0ff;
            border-radius: 8px;
            padding: 1rem;
            width: 280px;
            box-shadow: 0 0 10px #0ff;
            color: #0ff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .upload-card h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.2rem;
        }
        .upload-card p {
            margin: 0.2rem 0;
            font-size: 0.9rem;
        }
        .btn-download {
            margin-top: 1rem;
            background-color: #0ff;
            color: #000;
            border: none;
            padding: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .btn-download:hover {
            background-color: #00caca;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Uploaded Presentations</h1>
            <p>List of all uploaded files for this session.</p>
        </header>

        <main>
  <div id="uploads-container" class="uploads-container">
    <!-- Cards will be generated dynamically -->
  </div>
</main>

    </div>

     <footer>
               <p>Developed by Himanshu Vk</p>
       </footer>

    <script>
async function loadUploads() {
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get("session");
    const container = document.getElementById("uploads-container");

    if (!sessionId) {
        container.innerHTML = "<p>Invalid session.</p>";
        return;
    }

    const response = await fetch(`/view-data?session=${sessionId}`);
    const uploads = await response.json();
    container.innerHTML = "";

    if (uploads.length === 0) {
        container.innerHTML = "<p>No uploads yet.</p>";
        return;
    }

    // ✅ Group uploads by user (so one card per person)
    const grouped = {};
    uploads.forEach(file => {
        const key = `${file.uploader}-${file.rollNumber}`;
        if (!grouped[key]) {
            grouped[key] = {
                name: file.uploader,
                roll: file.rollNumber,
                time: file.uploadTime,
                files: []
            };
        }
        grouped[key].files.push(file);
    });

    Object.values(grouped).forEach(upload => {
        const card = document.createElement("div");
        card.classList.add("upload-card");

        const header = document.createElement("div");
        header.classList.add("upload-header");
        header.innerHTML = `
            <h3>${upload.name}</h3>
            <p>Roll No: ${upload.roll}</p>
            <small>${new Date(upload.time).toLocaleString()}</small>
            <button class="toggle-btn">Show Files</button>
        `;
        card.appendChild(header);

        const fileList = document.createElement("div");
        fileList.classList.add("file-list", "hidden");

        upload.files.forEach(file => {
            const fileItem = document.createElement("div");
            fileItem.classList.add("file-item");

            const displayName = file.originalName || file.filename || "file";
            const lower = String(displayName).toLowerCase();
            const isImage = lower.endsWith(".png") || lower.endsWith(".jpg") || lower.endsWith(".jpeg");

            if (isImage) {
                fileItem.innerHTML = `
                    <img src="/download/${sessionId}/${file.filename}" alt="${displayName}" class="preview-img">
                    <p>${displayName}</p>
                    <a href="/download/${sessionId}/${file.filename}" download class="download-btn">Download</a>
                `;
            } else {
                fileItem.innerHTML = `
                    <p>${displayName}</p>
                    <a href="/download/${sessionId}/${file.filename}" download class="download-btn">Download</a>
                `;
            }

            fileList.appendChild(fileItem);
        });

        card.appendChild(fileList);
        container.appendChild(card);

        // Toggle view/hide for files
        header.querySelector(".toggle-btn").addEventListener("click", () => {
            fileList.classList.toggle("hidden");
            const btn = header.querySelector(".toggle-btn");
            btn.textContent = fileList.classList.contains("hidden") ? "Show Files" : "Hide Files";
        });
    });
}

document.addEventListener("DOMContentLoaded", loadUploads);
</script>

</body>
</html>
