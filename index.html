<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Presentation Sharing - Presenter</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>QR-Based Presentation Sharing</h1>
            <p>Create a session and share the QR code with students to collect their presentations.</p>
        </header>

        <main>
    <!-- 1️⃣ Create Session -->
    <section id="create-session">
        <button id="create-btn" class="btn">Create Session</button>
    </section>

    <!-- 2️⃣ Search Session -->
    <!-- 3️⃣ Session Info (After Creation) -->
    <section id="session-info" class="hidden">
        <h2>Session Created</h2>
        <p>Share this QR code with students:</p>
        <div id="qr-container">
            <img id="qr-code" alt="QR Code" />
        </div>
        <div class="session-code-box">
            <div class="session-code-label">Session Code</div>
            <div class="session-code-row">
                <div id="session-code" class="session-code">----</div>
                <button id="copy-code-btn" class="btn btn-compact" type="button">Copy</button>
            </div>
            <div id="copy-code-msg" class="helper hidden"></div>
        </div>
        <p>Or share this link: <span id="upload-link"></span></p>
        <!-- View Uploads button removed -->
    </section>

</main>

    </div>

     <footer>
               <p>Developed by Himanshu Vk</p>
               <p style="margin-top: 0.25rem;"><a href="/admin" style="color: var(--accent); text-decoration: underline;">Admin panel</a></p>
       </footer>

    <script src="js/script.js"></script>
</body>
</html>
